<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お問い合わせ | ブラックジャック基本戦略トレーナー</title>
<style>
  :root{
    --accent:#f2c14e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  body{
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:#0a3d2e;
    color:#fff;
    line-height:1.7;
    padding: 8px 10px;
    padding-top: calc(env(safe-area-inset-top) + 8px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
    padding-left: calc(env(safe-area-inset-left) + 10px);
    padding-right: calc(env(safe-area-inset-right) + 10px);
  }
  .page-content{
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width:640px;
    margin:0 auto;
    overflow-y: auto;
  }
  h1{
    font-size:clamp(1.1rem,3vw,1.3rem);
    margin-bottom:16px;
    color:var(--accent);
    text-align:center;
  }
  p{
    margin-bottom:16px;
    font-size:clamp(0.82rem,2.2vw,0.92rem);
  }
  label{
    display:block;
    margin-bottom:6px;
    font-size:clamp(0.78rem,2vw,0.85rem);
    font-weight:bold;
  }
  input, textarea{
    width:100%;
    padding:clamp(8px,2vw,10px) clamp(10px,2.5vw,12px);
    margin-bottom:16px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
    color:#fff;
    font-size:clamp(0.85rem,2.2vw,0.9rem);
    font-family:inherit;
    box-sizing:border-box;
  }
  input::placeholder, textarea::placeholder{
    color:rgba(255,255,255,0.4);
  }
  textarea{
    resize:vertical;
    min-height:clamp(100px,25vh,140px);
  }
  button{
    width:100%;
    padding:clamp(12px,3vw,14px);
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#222;
    font-weight:bold;
    font-size:clamp(0.9rem,2.4vw,1rem);
    cursor:pointer;
  }
  button:active{
    transform:scale(0.98);
  }
  a{
    color:var(--accent);
    text-decoration:underline;
  }

  footer {
    flex-shrink: 0;
    width: 100%;
    background: rgba(10,61,46,0.95);
    backdrop-filter: blur(4px);
    border-top: 1px solid rgba(255,255,255,0.15);
    padding: 10px 16px;
    font-size: clamp(0.65rem, 1.7vw, 0.75rem);
    text-align: center;
    margin-top: 8px;
  }
  footer a{
    color: rgba(255,255,255,0.85);
    text-decoration:underline;
  }
  footer a:active{
    color: rgba(255,255,255,1);
  }
  footer .footer-links{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0;
    margin:0;
  }
  footer .footer-links a:not(:first-child){
    border-left:1px solid rgba(255,255,255,0.35);
    padding-left:14px;
    margin-left:14px;
  }
</style>
</head>
<body>

<div class="page-content">
  <h1>お問い合わせ</h1>

  <p>
  アプリの不具合報告、ご意見・ご感想、掲載内容に関するお問い合わせなどは、下記のフォームからお願いいたします。内容を確認の上、必要に応じてご返信いたします。
  </p>

  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="name">お名前</label>
    <input type="text" id="name" name="name" placeholder="山田 太郎" required>

    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email" placeholder="example@example.com" required>

    <label for="message">お問い合わせ内容</label>
    <textarea id="message" name="message" placeholder="不具合の内容やご意見をご記入ください" required></textarea>

    <button type="submit">送信する</button>
  </form>
</div>

<footer>
    <p class="footer-links">
      <a href="./">メニュー</a>
      <a href="./privacy-policy.html">プライバシーポリシー</a>
    </p>
</footer>

</body>
</html>
